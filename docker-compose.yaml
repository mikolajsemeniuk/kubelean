services:
  # MiniMax-M2.7 172B-A10B (NVFP4). Profil: minimax
  minimax-m2.7:
    image: vllm/vllm-openai:v0.18.0-cu130
    profiles: ["minimax-m2.7"]
    network_mode: host
    ipc: host
    volumes:
      - /home/mikolajsemeniuk/.cache/huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_USE_MODELSCOPE=false
      - MAX_JOBS=4
      - VLLM_NVFP4_GEMM_BACKEND=flashinfer-cutlass
      - VLLM_USE_FLASHINFER_MOE_FP4=0
      - SAFETENSORS_FAST_GPU=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stop_grace_period: 60s
    command:
      - --model
      - saricles/MiniMax-M2.7-REAP-172B-A10B-NVFP4-GB10
      - --served-model-name
      - minimax-m2.7
      - --host
      - 0.0.0.0
      - --port
      - "12000"
      - --gpu-memory-utilization
      - "0.93"
      - --max-model-len
      - "131072"
      - --max-num-seqs
      - "32"
      - --kv-cache-dtype
      - fp8_e4m3
      - --compilation-config
      - '{"cudagraph_mode": "none"}'
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser
      - minimax_m2
      - --reasoning-parser
      - minimax_m2_append_think
      - --trust-remote-code

  glm-4.5-air:
    image: vllm/vllm-openai:glm52-arm64-cu130
    profiles: ["glm-4.5-air"]
    network_mode: host
