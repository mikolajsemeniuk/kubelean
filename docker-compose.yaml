      - "12000"
      - --gpu-memory-utilization
      - "0.90"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "32"
      - --compilation-config
      - '{"cudagraph_mode": "none"}'
      - --trust-remote-code

  lfm2.5:
