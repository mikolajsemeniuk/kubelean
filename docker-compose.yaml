services:
  # MiniMax-M2.7 172B-A10B (NVFP4). Profil: minimax
  minimax-m2.7:
    image: vllm/vllm-openai:v0.18.0-cu130
    profiles: ["minimax-m2.7"]
    network_mode: host
    ipc: host
    volumes:
      - /home/mikolajsemeniuk/.cache/huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_USE_MODELSCOPE=false
      - MAX_JOBS=4
      - VLLM_NVFP4_GEMM_BACKEND=flashinfer-cutlass
      - VLLM_USE_FLASHINFER_MOE_FP4=0
      - SAFETENSORS_FAST_GPU=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stop_grace_period: 60s
    command:
      - --model
      - saricles/MiniMax-M2.7-REAP-172B-A10B-NVFP4-GB10
      - --served-model-name
      - minimax-m2.7
      - --host
      - 0.0.0.0
      - --port
      - "12000"
      - --gpu-memory-utilization
      - "0.93"
      - --max-model-len
      - "131072"
      - --max-num-seqs
      - "32"
      - --kv-cache-dtype
      - fp8_e4m3
      - --compilation-config
      - '{"cudagraph_mode": "none"}'
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser
      - minimax_m2
      - --reasoning-parser
      - minimax_m2_append_think
      - --trust-remote-code

  glm-4.5-air:
    image: vllm/vllm-openai:glm52-arm64-cu130
    profiles: ["glm-4.5-air"]
    network_mode: host
    ipc: host
    volumes:
      - /home/mikolajsemeniuk/.cache/huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_USE_MODELSCOPE=false
      - MAX_JOBS=4
      - VLLM_NVFP4_GEMM_BACKEND=marlin
      - VLLM_TEST_FORCE_FP8_MARLIN=1
      - VLLM_USE_FLASHINFER_MOE_FP4=0
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
      - SAFETENSORS_FAST_GPU=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stop_grace_period: 60s
    command:
      - --model
      - Firworks/GLM-4.5-Air-REAP-82B-A12B-nvfp4
      - --served-model-name
      - glm-4.5-air
      - --host
      - 0.0.0.0
      - --port
      - "12000"
      - --gpu-memory-utilization
      - "0.90"
      - --max-model-len
      - "131072"
      - --max-num-seqs
      - "32"
      - --kv-cache-dtype
      - fp8
      - --compilation-config
      - '{"cudagraph_mode": "none"}'
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser
      - glm45
      - --reasoning-parser
      - glm45
      - --trust-remote-code

  qwen2.5:
    image: vllm/vllm-openai:v0.20.0-cu130
    profiles: ["qwen2.5"]
    network_mode: host
    ipc: host
    volumes:
      - /home/mikolajsemeniuk/.cache/huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_USE_MODELSCOPE=false
      - MAX_JOBS=4
      - SAFETENSORS_FAST_GPU=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stop_grace_period: 60s
    command:
      - --model
      - Qwen/Qwen2.5-7B-Instruct
      - --served-model-name
      - qwen2.5:7b-instruct
      - --host
      - 0.0.0.0
      - --port
      - "12000"
      - --gpu-memory-utilization
      - "0.90"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "32"
      - --compilation-config
      - '{"cudagraph_mode": "none"}'
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes

  # Official block-wise FP8 checkpoint ("nearly identical" to bf16 per model
  # card) - do NOT add --quantization on top. Non-thinking (client sends
  # enable_thinking=false), so no --reasoning-parser. TRITON_ATTN: FlashInfer
  # has an FP8 accuracy bug on Blackwell. KV cache stays bf16 (no memory
  # pressure at 128GB; one quantization less to report). No ngram spec decode
  # (vllm#40875 corrupts structured output; also perturbs per-seed sampling).
  # Image `latest`, not v0.20.0-cu130: stock v0.20.0 lacks sm_121 FP8 kernels
  # on aarch64; `latest` is proven on this box by the gemma fp8 run.
  qwen3-14b:
    image: vllm/vllm-openai:latest
    profiles: ["qwen3-14b"]
    network_mode: host
    ipc: host
    volumes:
      - /home/mikolajsemeniuk/.cache/huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_USE_MODELSCOPE=false
      - MAX_JOBS=4
      - SAFETENSORS_FAST_GPU=1
      # sm121: Marlin-fallback race gives silently WRONG results without this
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stop_grace_period: 60s
    command:
      - --model
      - Qwen/Qwen3-14B-FP8
      - --served-model-name
      - qwen3:14b
      - --host
      - 0.0.0.0
      - --port
      - "12000"
      - --attention-backend
      - TRITON_ATTN
      - --gpu-memory-utilization
      - "0.9"
      - --max-model-len
      - "16384"
      - --max-num-seqs
      - "128"

  # Calibrated FP8-dynamic quant of microsoft/phi-4 by Red Hat/Neural Magic
  # (measured 99.9% accuracy recovery vs bf16) - preferred over online
  # --quantization fp8. Native context is 16k, hence max-model-len 16384.
  # Same Blackwell/measurement rules as qwen3-14b: TRITON_ATTN, bf16 KV
  # cache, no spec decode, image `latest` for sm_121 FP8 kernels.
  phi4-14b:
    image: vllm/vllm-openai:latest
    profiles: ["phi4-14b"]
    network_mode: host
    ipc: host
    volumes:
      - /home/mikolajsemeniuk/.cache/huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_USE_MODELSCOPE=false
      - MAX_JOBS=4
      - SAFETENSORS_FAST_GPU=1
      # sm121: Marlin-fallback race gives silently WRONG results without this
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stop_grace_period: 60s
    command:
      - --model
      - RedHatAI/phi-4-FP8-dynamic
      - --served-model-name
      - phi4:14b
      - --host
      - 0.0.0.0
      - --port
      - "12000"
      - --attention-backend
      - TRITON_ATTN
      - --gpu-memory-utilization
      - "0.9"
      - --max-model-len
      - "16384"
      - --max-num-seqs
      - "128"

  gemma-4:
    image: vllm/vllm-openai:latest
    profiles: ["gemma-4"]
    network_mode: host
    ipc: host
    volumes:
      - /home/mikolajsemeniuk/.cache/huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_USE_MODELSCOPE=false
      - MAX_JOBS=4
      - SAFETENSORS_FAST_GPU=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stop_grace_period: 60s
    command:
      - --model
      - google/gemma-4-12B-it
      - --served-model-name
      - gemma4:12b
      - --host
      - 0.0.0.0
      - --port
      - "12000"
      - --gpu-memory-utilization
      - "0.92"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "128"
      - --quantization
      - fp8
      - --kv-cache-dtype
      - fp8_e4m3
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --speculative-config
      - '{"method": "ngram", "num_speculative_tokens": 4, "prompt_lookup_min": 2, "prompt_lookup_max": 5}'

  # The official 2512 checkpoint is ALREADY natively FP8 (fine-grained, no
  # quality loss per model card) - never add --quantization fp8 on top; the
  # bf16 twin is the separate -BF16 repo. The three mistral-format flags are
  # the canonical vLLM recipe for this model and must stay. Tool parser
  # dropped (unused by the producer). Same Blackwell/measurement rules as
  # qwen3-14b: TRITON_ATTN, bf16 KV cache, no spec decode, image `latest`.
  ministral-3:
    image: vllm/vllm-openai:latest
    profiles: ["ministral-3"]
    network_mode: host
    ipc: host
    volumes:
      - /home/mikolajsemeniuk/.cache/huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_USE_MODELSCOPE=false
      - MAX_JOBS=4
      - SAFETENSORS_FAST_GPU=1
      # sm121: Marlin-fallback race gives silently WRONG results without this
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stop_grace_period: 60s
    command:
      - --model
      - mistralai/Ministral-3-8B-Instruct-2512
      - --served-model-name
      - ministral-3:8b
      - --host
      - 0.0.0.0
      - --port
      - "12000"
      - --attention-backend
      - TRITON_ATTN
      - --gpu-memory-utilization
      - "0.9"
      - --max-model-len
      - "16384"
      - --max-num-seqs
      - "128"
      - --tokenizer-mode
      - mistral
      - --config-format
      - mistral
      - --load-format
      - mistral

volumes:
  vllm-cache:
