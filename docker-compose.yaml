      - VLLM_USE_MODELSCOPE=false
      - MAX_JOBS=4
      - VLLM_NVFP4_GEMM_BACKEND=marlin
      - VLLM_TEST_FORCE_FP8_MARLIN=1
      - VLLM_USE_FLASHINFER_MOE_FP4=0
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
      - SAFETENSORS_FAST_GPU=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stop_grace_period: 60s
    command:
      - --model
      - Firworks/GLM-4.5-Air-REAP-82B-A12B-nvfp4
      - --served-model-name
      - glm-4.5-air
      - --host
      - 0.0.0.0
      - --port
      - "12000"
      - --gpu-memory-utilization
      - "0.90"
      - --max-model-len
      - "131072"
      - --max-num-seqs
      - "32"
      - --kv-cache-dtype
      - fp8
      - --compilation-config
      - '{"cudagraph_mode": "none"}'
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser
      - glm45
      - --reasoning-parser
      - glm45
      - --trust-remote-code

  codellama:
    image: vllm/vllm-openai:v0.20.0-cu130
    profiles: ["codellama"]
    network_mode: host
    ipc: host
    volumes:
      - /home/mikolajsemeniuk/.cache/huggingface:/root/.cache/huggingface
