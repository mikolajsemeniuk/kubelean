apiVersion: apps/v1
kind: Deployment
metadata:
  {{- if .Created }}
  creationTimestamp: "{{ .Created }}"
  {{- end }}
  {{- if .Generation }}
  generation: {{ .Generation }}
  {{- end }}
  name: {{ .Name }}
  namespace: {{ .Namespace }}
  labels:
    app: {{ .App }}
  {{- if .ResourceVersion }}
  resourceVersion: "{{ .ResourceVersion }}"
  {{- end }}
  {{- if .UID }}
  uid: {{ .UID }}
  {{- end }}
spec:
  replicas: {{ .Replicas }}
  selector:
    matchLabels:
      app: {{ .SelectorApp }}
  template:
    metadata:
      {{- if .Created }}
      creationTimestamp: null
      {{- end }}
      labels:
        app: {{ .PodApp }}
    spec:
      {{- if .PriorityClassName }}
      priorityClassName: {{ .PriorityClassName }}
      {{- end }}
      {{- if .ServiceAccountName }}
      serviceAccountName: {{ .ServiceAccountName }}
      {{- end }}
      {{- if .ImagePullSecret }}
      imagePullSecrets:
        - name: {{ .ImagePullSecret }}
      {{- end }}
      containers:
        - name: {{ .ContainerName }}
          image: {{ .Image }}
          ports:
            - containerPort: {{ .ContainerPort }}
          {{- if .VolumeRef }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
          {{- if or .ConfigMapRef .SecretRef }}
          envFrom:
            {{- if .ConfigMapRef }}
            - configMapRef:
                name: {{ .ConfigMapRef }}
            {{- end }}
            {{- if .SecretRef }}
            - secretRef:
                name: {{ .SecretRef }}
            {{- end }}
          {{- end }}
      {{- if .VolumeRef }}
      volumes:
        - name: data
          {{- if eq .VolumeKind "pvc" }}
          persistentVolumeClaim:
            claimName: {{ .VolumeRef }}
          {{- else if eq .VolumeKind "configMap" }}
          configMap:
            name: {{ .VolumeRef }}
          {{- else }}
          secret:
            secretName: {{ .VolumeRef }}
          {{- end }}
      {{- end }}
{{- if eq .Status "healthy" }}
status:
  availableReplicas: {{ .Replicas }}
  conditions:
    - lastTransitionTime: "{{ .Created }}"
      lastUpdateTime: "{{ .Created }}"
      message: Deployment has minimum availability.
      reason: MinimumReplicasAvailable
      status: "True"
      type: Available
  observedGeneration: {{ .Generation }}
  readyReplicas: {{ .Replicas }}
  replicas: {{ .Replicas }}
  updatedReplicas: {{ .Replicas }}
{{- else if eq .Status "failing" }}
status:
  conditions:
    - lastTransitionTime: "{{ .Created }}"
      lastUpdateTime: "{{ .Created }}"
      message: Deployment does not have minimum availability.
      reason: MinimumReplicasUnavailable
      status: "False"
      type: Available
  observedGeneration: {{ .Generation }}
  replicas: {{ .Replicas }}
  unavailableReplicas: {{ .Replicas }}
  updatedReplicas: {{ .Replicas }}
{{- end }}
