apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  {{- if .Created }}
  creationTimestamp: "{{ .Created }}"
  {{- end }}
  {{- if .Generation }}
  generation: {{ .Generation }}
  {{- end }}
  name: {{ .Name }}
  namespace: {{ .Namespace }}
  labels:
    app: {{ .App }}
  {{- if .ResourceVersion }}
  resourceVersion: "{{ .ResourceVersion }}"
  {{- end }}
  {{- if .UID }}
  uid: {{ .UID }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ .TargetKind }}
    name: {{ .TargetName }}
  minReplicas: {{ .MinReplicas }}
  maxReplicas: {{ .MaxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
{{- /* the failing message stays symptom-only: the real one names the missing
       target, which would leak the ground truth into a non-deciding field */ -}}
{{- if eq .Status "healthy" }}
status:
  conditions:
    - lastTransitionTime: "{{ .Created }}"
      message: recommended size matches current size
      reason: ReadyForNewScale
      status: "True"
      type: AbleToScale
  currentReplicas: {{ .MinReplicas }}
  desiredReplicas: {{ .MinReplicas }}
{{- else if eq .Status "failing" }}
status:
  conditions:
    - lastTransitionTime: "{{ .Created }}"
      message: the HPA controller was unable to get the target's current scale
      reason: FailedGetScale
      status: "False"
      type: AbleToScale
  currentReplicas: 0
  desiredReplicas: 0
{{- end }}
